name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (Zig ${{ matrix.zig }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.17.0"]
        optimize: ["Debug", "ReleaseFast"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # mlugg/setup-zig v2.2.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - run: zig version
      - run: zig fmt --check src/ examples/ build.zig
      - run: zig build test --summary all -Doptimize=${{ matrix.optimize }}
      - run: zig build -Doptimize=${{ matrix.optimize }}
      - run: zig build run-example -Doptimize=${{ matrix.optimize }}
      - name: C ABI integration test
        run: |
          zig cc tests/c/test_c_abi.c zig-out/lib/libzyntra_ui.a -Isrc/c-abi -o /tmp/zyntra-c-test
          /tmp/zyntra-c-test
      - name: New examples smoke test
        # Os exemplos novos (UI otimizada, viewport 3D e caminhos
        # vetoriais) imprimem um resumo; o grep valida que rodaram até
        # o fim.
        run: |
          set -o pipefail
          zig build run-ui-perf -Doptimize=${{ matrix.optimize }} 2>&1 | tee /tmp/zyntra-ui-perf.log
          grep -q "^ui_perf items=" /tmp/zyntra-ui-perf.log
          zig build run-viewport3d -Doptimize=${{ matrix.optimize }} 2>&1 | tee /tmp/zyntra-vp3d.log
          grep -q "^viewport3d " /tmp/zyntra-vp3d.log
          zig build run-paths -Doptimize=${{ matrix.optimize }} 2>&1 | tee /tmp/zyntra-paths.log
          grep -q "^paths " /tmp/zyntra-paths.log
          zig build run-app -Doptimize=${{ matrix.optimize }} 2>&1 | tee /tmp/zyntra-app.log
          grep -q "^app lista itens=" /tmp/zyntra-app.log
          grep -q "^app a11y nos=" /tmp/zyntra-app.log
      - name: Benchmark smoke test
        # std.debug.print escreve em stderr: fundir para o grep validar.
        run: |
          set -o pipefail
          zig build run-bench -Doptimize=${{ matrix.optimize }} 2>&1 | tee /tmp/zyntra-bench.log
          grep -q "^bench frames=.*checksum=" /tmp/zyntra-bench.log
          grep -q "^treeview frames=.*checksum=" /tmp/zyntra-bench.log
          grep -q "^layout iters=.*checksum=" /tmp/zyntra-bench.log
          grep -q "^partial frames=.*painted=" /tmp/zyntra-bench.log
          grep -q "^svg iters=.*checksum=" /tmp/zyntra-bench.log
          grep -q "^doc ops=.*checksum=" /tmp/zyntra-bench.log
          grep -q "^virt iters=.*checksum=" /tmp/zyntra-bench.log
          grep -q "^mem growths=" /tmp/zyntra-bench.log
